spring:
  datasource:
    url: jdbc:postgresql://db:5432/ticket_system
    username: postgres
    password: admin_postgres#!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
