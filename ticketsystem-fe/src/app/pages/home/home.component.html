<div class="card p-4">
  <ng-container *ngIf="user; else notLogged">
    <h2>Benvenuto in DGS <span class="username">{{ user.username }}</span></h2>
    <p>Usa il menu a sinistra per navigare tra le funzionalità.</p>
    </ng-container>
    <ng-template #notLogged>
      <h2>Benvenuto in DGS</h2>
      <p>Questa è la dashboard iniziale. Effettua il login e usa il menu a sinistra per navigare tra le funzionalità.</p>
    </ng-template>
</div>
