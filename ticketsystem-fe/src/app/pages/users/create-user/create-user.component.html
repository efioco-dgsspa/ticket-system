<div class="create-user-container">
  <h2>Crea Nuovo Utente</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" placeholder="Inserisci username">
      <div class="error" *ngIf="userForm.get('username')?.touched && userForm.get('username')?.invalid">
        Username obbligatorio
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Inserisci email">
      <div class="error" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
        Email non valida
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Inserisci password">
      <div class="error" *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">
        Password obbligatoria
      </div>
    </div>

    <div class="form-group">
      <label for="role">Ruolo</label>
      <select id="role" formControlName="role">
        <option value="" disabled>Seleziona ruolo</option>
        <option *ngFor="let r of roles" [value]="r.id">{{ r.name }}</option>
      </select>
      <div class="error" *ngIf="userForm.get('role')?.touched && userForm.get('role')?.invalid">
        Seleziona un ruolo
      </div>
    </div>

    <button type="submit" [disabled]="userForm.invalid">Crea Utente</button>

  </form>
</div>
