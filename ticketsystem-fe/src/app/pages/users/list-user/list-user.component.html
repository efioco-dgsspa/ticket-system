<div class="search-user-container">
  <h2>Ricerca Utenti</h2>

  <form (ngSubmit)="applySearch()" class="search-form-horizontal">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="search.username"
        name="username"
        placeholder="Inserisci username"
      />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="text"
        [(ngModel)]="search.email"
        name="email"
        placeholder="Inserisci email"
      />
    </div>

    <div class="form-group">
      <label for="role">Ruolo</label>
      <select id="role" [(ngModel)]="search.roles[0]" name="role">
        <option value="" disabled selected>Seleziona ruolo</option>
        <option *ngFor="let r of roles" [value]="r.id">{{ r.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="active">Attivo</label>
      <select id="active" [(ngModel)]="search.active" name="active">
        <option [ngValue]="null">Tutti</option>
        <option [ngValue]="true">Attivi</option>
        <option [ngValue]="false">Disattivati</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" (click)="resetSearch()">❌ Reset</button>
      <button type="submit">🔍 Cerca</button>
    </div>
  </form>
</div>

<table class="table table-striped" *ngIf="!loading; else loadingTpl">
  <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Ruolo</th>
      <th>Attivo</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of users">
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
      <td class="center">{{ getRoleNames(u) }}</td>
      <td class="center">
        <span [class.active]="u.active" [class.inactive]="!u.active">
          {{ u.active ? 'Sì' : 'No' }}
        </span>
      </td>
      <td class="actions-cell center">
        <button class="menu-btn" (click)="toggleMenu(u, $event)">☰</button>
        <div class="dropdown" *ngIf="u.showMenu" (click)="$event.stopPropagation()">
          <button *ngIf="can('VIEW')" (click)="viewUser(u)">👁️ Visualizza</button>
          <button *ngIf="can('EDIT')" (click)="editUser(u)">✏️ Modifica</button>
          <button *ngIf="can('TOGGLE')" (click)="toggleActivation(u)">
            {{ u.active ? '🔒 Disattiva' : '🔓 Attiva' }}
          </button>
          <button *ngIf="can('DELETE')" (click)="deleteUser(u)">🗑️ Elimina</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<ng-template #loadingTpl>
  <div class="loading">Caricamento utenti...</div>
</ng-template>
